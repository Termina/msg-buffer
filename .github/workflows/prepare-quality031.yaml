name: Prepare existing quality baseline
on:
  push:
    branches: [prepare/msg-buffer-quality031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Verify exact source and lower existing baseline
        run: |
          set -euo pipefail
          test "$(git hash-object calcit.cirru)" = fe31cd96277f9f4c22140266ec342ab9897ecdb5
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit analyze quality --baseline config/calcit-quality.cirru --format json > quality-before.json
          calcit analyze quality --write-baseline config/calcit-quality.cirru
          calcit analyze quality --baseline config/calcit-quality.cirru --format json > quality-after.json
          git diff --exit-code -- calcit.cirru
          git diff -- config/calcit-quality.cirru > baseline-lowering.diff
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: reviewed-existing-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            config/calcit-quality.cirru
            quality-before.json
            quality-after.json
            baseline-lowering.diff
          if-no-files-found: error
          retention-days: 7
