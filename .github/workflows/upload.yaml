name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: msg-buffer-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru

    - name: Resolve Calcit dependencies
      # Resolve the declared formal module tags independently of local module exports.
      run: caps --strict --ci

    - name: Install JavaScript dependencies
      run: yarn install --immutable

    - name: Verify Calcit toolchain
      run: caps verify --toolchain

    - name: Check canonical Calcit snapshot
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        test ! -e compact.cirru
        test ! -e package.cirru

    - name: Check Calcit types
      run: |
        set -euo pipefail
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'

    - name: Check application dynamic methods
      run: calcit calcit.cirru analyze weak-types --only dynamic-method --format json

    - name: Check deprecated Calcit APIs
      run: |
        set -euo pipefail
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

    - name: Audit provider dynamic methods
      run: calcit calcit.cirru analyze weak-types --only dynamic-method --deps --format json

    - name: Check Calcit quality baseline
      run: calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Run Calcit regression tests
      run: calcit calcit.cirru test --require-match --summary-only --format json

    - name: Build extension package
      run: yarn build

    - name: Validate extension package
      run: |
        test -f extension/dist/index.html
        find extension/dist/assets -maxdepth 1 -name '*.css' -print -quit | grep -q .
        find extension/dist/assets -maxdepth 1 -name 'gemini-icon-*.png' -print -quit | grep -q .
        find extension/dist/assets -maxdepth 1 -name 'axios-*.js' -print -quit | grep -q .
        node --check extension/service-worker.js
        node --check extension/get-selected.mjs
        node -e 'const manifest = require("./extension/manifest.json"); if (manifest.manifest_version !== 3 || manifest.side_panel?.default_path !== "dist/index.html" || manifest.content_scripts || manifest.permissions.includes("tabs")) process.exit(1)'
        test -z "$(grep -E 'https?://' extension/dist/index.html)"
        test -z "$(grep -E 'axios-' extension/dist/index.html)"
        test -z "$(grep -R 'feathericons.com' extension/dist/assets || true)"

    - name: Save tested local-assets build for acceptance
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: extension-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        path: extension/dist
        if-no-files-found: error
        retention-days: 7

    - name: Select CDN asset path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${CDN_ORIGIN}/${asset_prefix}" >> "$GITHUB_OUTPUT"

    - name: Build web assets with CDN URLs
      env:
        CDN_BASE_URL: ${{ steps.asset-path.outputs.base-url }}
      run: yarn vite build --base "$CDN_BASE_URL"

    - name: Upload and verify web assets on COS
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Select deployment path
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy-path
      env:
        REPOSITORY: ${{ github.repository }}
      run: |
        echo "dest=rsync-user@tiye.me:/web-assets/repo/${REPOSITORY}" >> "$GITHUB_OUTPUT"

    - name: Prepare deployment directory
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        DEPLOY_DEST: ${{ steps.deploy-path.outputs.dest }}
      run: |
        key_file="$RUNNER_TEMP/deploy_key"
        printf '%s\n' "$DEPLOY_KEY" > "$key_file"
        chmod 600 "$key_file"
        deploy_path="${DEPLOY_DEST#*:}"
        ssh -i "$key_file" -o StrictHostKeyChecking=no rsync-user@tiye.me "mkdir -p -- '$deploy_path'"

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: ${{ steps.deploy-path.outputs.dest }}

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
