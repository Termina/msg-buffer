name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-cr@0.0.9

    - name: Resolve Calcit dependencies
      run: caps --ci

    - name: Install JavaScript dependencies
      run: yarn install --immutable

    - name: Check Calcit types
      run: cr --check-only

    - name: Check Calcit quality baseline
      run: cr analyze quality --baseline config/calcit-quality.json

    - name: Compile Calcit JavaScript
      run: cr js

    - name: Build site
      run: yarn vite build --base=./

    - name: Select deployment path
      id: deploy-path
      env:
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          echo "dest=rsync-user@tiye.me:/web-assets/repo/${REPOSITORY}/pr/${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        else
          echo "dest=rsync-user@tiye.me:/web-assets/repo/${REPOSITORY}" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy to server
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: ${{ steps.deploy-path.outputs.dest }}

    - name: Display status from deploy
      run: echo "${{ steps.deploy.outputs.status }}"
